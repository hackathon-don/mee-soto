name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sample:
    name: Sample scoring and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: |
          python3 -m pip install -c requirements.lock pytest
          make test

      - name: Score the public sample
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/ci_score.py map | tee -a "$GITHUB_STEP_SUMMARY"
