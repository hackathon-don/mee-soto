name: Sengi runner trial

on:
  push:
    branches: [devin/1795383200-sengi-runner-measurements]

permissions: {}

jobs:
  unit:
    name: Unit tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, sengi-basic-4-ubuntu-2404]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: |
          python3 -m pip install -c requirements.lock pytest
          make test

  image:
    name: Image build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, sengi-basic-4-ubuntu-2404]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: blast-radius-entry
          load: true
          push: false
          cache-from: type=gha,scope=sengi-trial-1795383200-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=sengi-trial-1795383200-${{ matrix.runner }}
      - name: Save image
        run: |
          set -euo pipefail
          docker save blast-radius-entry | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record map digest
        run: docker run --rm --platform linux/amd64 --entrypoint sha256sum blast-radius-entry /app/strategies/selectors/file_map.json.gz
